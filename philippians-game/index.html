<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>以巴弗提的旅程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#111726;
  --night-2:#1a2235;
  --panel:#202a40;
  --line:#34405a;
  --text:#ebe5d6;
  --muted:#a6a99f;
  --lamp:#f2c14e;        /* 圣灵的光 */
  --lamp-dim:#8a7440;
  --leaf:#86ad6f;        /* 根与果子 */
  --germ:#b95fa3;        /* 病菌 */
  --fever:#e0645a;       /* 病 */
  --earth:#6b5a45;
  --display:"ZCOOL XiaoWei","Noto Serif SC","Songti SC",serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
[hidden]{display:none!important}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:980px;margin:0 auto}

/* ---------- HUD ---------- */
#hud{display:flex;align-items:center;gap:14px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
#hud .where{flex:1;min-width:0}
#hud .act{font-family:var(--display);font-size:20px;line-height:1.2;color:var(--lamp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:grid;gap:5px;width:min(40%,220px)}
.bar{display:grid;grid-template-columns:3.2em 1fr;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.bar i{display:block;height:7px;border-radius:4px;background:var(--night-2);overflow:hidden;position:relative}
.bar i b{position:absolute;inset:0 auto 0 0;width:0;border-radius:4px;transition:width .15s linear}
.bar.sick b{background:var(--fever)}
.bar.spirit b{background:var(--lamp)}
.bar.spirit.locked{opacity:.4}
#treeBtn{background:none;border:0;padding:0;width:74px;flex:none}
#treeBtn svg{display:block;width:100%;height:auto}
#burdens{display:flex;gap:4px;flex-wrap:wrap;font-size:11px}
#burdens span{background:var(--earth);color:var(--text);padding:0 6px;border-radius:3px}

/* ---------- Stage ---------- */
#stage{position:relative;overflow:hidden;min-height:0}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:22px 16px 28px}
.page{max-width:620px;margin:0 auto;display:grid;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--lamp-dim)}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(34px,8vw,56px);color:var(--lamp)}
h2{font-size:clamp(24px,5vw,32px)}
p{margin:0}
.story p{font-family:var(--serif);font-size:16.5px;line-height:1.95}
.verse{font-family:var(--serif);font-size:16px;line-height:1.9;padding:12px 16px;border-left:3px solid var(--lamp);background:rgba(242,193,78,.06)}
.verse cite{display:block;font-style:normal;font-family:var(--sans);font-size:12px;color:var(--lamp-dim);margin-top:4px}
.note{font-size:13px;color:var(--muted)}
.btn{background:var(--lamp);color:#241c08;border:0;border-radius:6px;padding:11px 20px;font-weight:700;justify-self:start}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* choice cards */
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--serif);font-size:15.5px;line-height:1.7;position:relative;transition:filter .3s,opacity .3s,border-color .2s}
.opt:hover{border-color:#51607f}
.opt .tag{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:2px}
.opt.spirit{border-color:var(--lamp-dim)}
.opt.spirit .tag{color:var(--lamp)}
.opt.dim{filter:blur(4px);opacity:.45;pointer-events:none}
.opt.locked{opacity:.4;pointer-events:none;border-style:dashed}
.hint{font-size:13px;color:var(--lamp);display:flex;gap:6px;align-items:center}
.reply{display:grid;gap:12px;padding:14px;border-radius:8px;background:var(--night-2)}
.reply.flesh{border-left:3px solid var(--germ)}
.reply.spirit{border-left:3px solid var(--leaf)}

/* ladder */
.ladder{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:18px;align-items:start}
@media (max-width:620px){.ladder{grid-template-columns:1fr}.ladder>.stairs{order:2;max-width:260px}#hud .act{font-size:17px}}
.stairs{width:100%}
.stairs svg{width:100%;height:auto;display:block}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(134,173,111,.35);pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.quake{animation:quake 1.1s cubic-bezier(.36,.07,.19,.97)}
@keyframes quake{
  0%,100%{transform:none}
  8%{transform:translate(-22px,6px) rotate(-2.2deg)}
  16%{transform:translate(20px,-8px) rotate(2deg)}
  24%{transform:translate(-18px,10px) rotate(-1.8deg)}
  32%{transform:translate(16px,-6px) rotate(1.6deg)}
  44%{transform:translate(-12px,5px) rotate(-1.1deg)}
  56%{transform:translate(9px,-4px) rotate(.8deg)}
  70%{transform:translate(-5px,2px) rotate(-.4deg)}
  85%{transform:translate(3px,-1px)}}
.crack{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(224,100,90,.45),rgba(224,100,90,0) 70%);animation:crack 1.2s ease-out forwards;z-index:4}
@keyframes crack{from{opacity:1}to{opacity:0}}
.reflect{display:grid;gap:10px;min-height:1em}
.reflect p{font-family:var(--serif);font-size:15.5px;line-height:1.85;color:var(--text);padding-left:12px;border-left:2px solid var(--leaf)}
.reflect p.pray{color:var(--lamp);border-left-color:var(--lamp)}
.reflect p.christ{color:#bfe0a8;border-left-color:var(--leaf);font-weight:600}
.holdtime{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rise{animation:rise 1.2s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* runner overlay */
.pack{position:absolute;left:0;right:0;bottom:0;padding:8px 16px 10px;display:flex;gap:5px;flex-wrap:wrap;background:linear-gradient(transparent,rgba(17,23,38,.92) 30%);pointer-events:none}
.pack .label{width:100%;font-size:11px;color:var(--muted);letter-spacing:.1em}
.strand{border:1px dashed #8a8f9c;background:rgba(138,143,156,.12);color:#c9ccd4;border-radius:4px;padding:1px 7px;font-size:12px}
.strand.deep{border:1px solid var(--germ);color:#e2a6d2;background:rgba(185,95,163,.18)}
#struggle{position:absolute;right:16px;top:44px;background:transparent;border:1px solid #8a8f9c;color:#c9ccd4;border-radius:20px;padding:6px 14px;font-size:13px}
.lookback{position:absolute;left:16px;top:44px;max-width:280px;background:var(--panel);border:1px solid var(--germ);border-radius:8px;padding:10px 12px;font-size:13px;display:grid;gap:8px}
.lookback button{justify-self:start;background:var(--germ);border:0;border-radius:4px;padding:4px 12px;color:#fff}

/* toast */
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(32,42,64,.96);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:14px;font-family:var(--serif);text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;z-index:5}
#toast.on{opacity:1}

/* ---------- Controls ---------- */
#ctrl{display:flex;gap:10px;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#ctrl .keys{flex:1;font-size:12px;color:var(--muted);min-width:0}
#waitBtn{user-select:none;-webkit-user-select:none;touch-action:none;display:flex;align-items:center;gap:8px;background:var(--night-2);border:1px solid var(--lamp-dim);color:var(--lamp);border-radius:24px;padding:9px 18px;font-weight:500}
#waitBtn.on{background:var(--lamp);color:#241c08;box-shadow:0 0 18px rgba(242,193,78,.55)}
#waitBtn.locked{border-color:var(--line);color:var(--muted)}
#fightBtn{background:transparent;border:1px solid var(--germ);color:#e2a6d2;border-radius:24px;padding:9px 16px}

/* fruit panel */
#fruitPanel{position:fixed;inset:0;background:rgba(10,13,22,.8);display:grid;place-items:center;z-index:10;padding:16px}
#fruitPanel .box{background:var(--night-2);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:420px;width:100%;display:grid;gap:12px}
.flist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.flist div{background:var(--panel);border-radius:6px;padding:8px;text-align:center;font-size:14px}
.flist small{display:block;color:var(--muted);font-size:11px}

/* ending */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--lamp)}
.stat span{font-size:12px;color:var(--muted)}
.bigtree{max-width:260px;justify-self:center;width:100%}
.loop{border-collapse:collapse;width:100%;font-size:14px}
.treebox{position:relative;width:100%;max-width:520px;justify-self:center;aspect-ratio:3/4;max-height:78vh}
.treebox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.treecap{min-height:5.5em;font-family:var(--serif);font-size:15px;line-height:1.85;padding:10px 14px;border-left:3px solid var(--lamp);background:rgba(242,193,78,.06)}
.treecap .christ{color:#bfe0a8}
.loop th,.loop td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.loop th{color:var(--lamp-dim);font-weight:500}
.loop td:first-child{white-space:nowrap;color:var(--muted)}
ol.q{margin:0;padding-left:1.4em;display:grid;gap:6px;font-size:14.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="where">
      <div class="act" id="actName">以巴弗提的旅程</div>
      <div class="sub" id="actSub">腓立比书 · 四章</div>
      <div id="burdens"></div>
    </div>
    <div class="bars">
      <div class="bar sick"><span>病</span><i><b id="sickBar"></b></i></div>
      <div class="bar spirit locked" id="spiritRow"><span>圣灵</span><i><b id="spiritBar"></b></i></div>
    </div>
    <button id="treeBtn" aria-label="查看圣灵所结的果子"></button>
  </header>
  <main id="stage"><div id="toast"></div></main>
  <footer id="ctrl">
    <div class="keys" id="keys">长按「等候」安静祷告，圣灵的光会亮起来。</div>
    <button id="fightBtn" hidden>⚔ 争战</button>
    <button id="waitBtn" class="locked" aria-label="长按等候">🕊 等候</button>
  </footer>
</div>
<div id="fruitPanel" hidden>
  <div class="box">
    <h2>圣灵所结的果子</h2>
    <p class="note">加拉太书 5:22-23。根向下扎多深，果子才向上结多少。</p>
    <div class="flist" id="flist"></div>
    <button class="btn" id="fruitClose">继续</button>
  </div>
</div>

<script>
"use strict";
/* ================= 状态 ================= */
const FRUITS=['仁爱','喜乐','和平','忍耐','恩慈','良善','信实','温柔','节制'];
const S={
  spirit:0, sick:0, unlocked:false, waiting:false,
  fruit:Object.fromEntries(FRUITS.map(f=>[f,0])),
  roots:0, obey:0, flesh:0, waitSec:0,
  burdens:[], dropped:0, thoughts:new Set(), kills:0, infect:0, oil:0, supplyGot:0, peace:0, received:0, peaceBroken:0
};
const C={lamp:'#f2c14e',leaf:'#86ad6f',germ:'#b95fa3',fever:'#e0645a',text:'#ebe5d6',muted:'#a6a99f',earth:'#6b5a45',night:'#111726',night2:'#1a2235',line:'#34405a'};
const $=s=>document.querySelector(s);
const FONT=getComputedStyle(document.body).fontFamily;
const stage=$('#stage');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ================= HUD ================= */
function setAct(name,sub){ $('#actName').textContent=name; $('#actSub').textContent=sub||''; }
function fruitColor(l){ return l<0?C.earth : l===0?'none' : l===1?'#a6c98e' : l===2?C.lamp : '#ef8a5a'; }
const FPOS=[[60,14],[36,22],[84,22],[22,40],[60,34],[98,40],[34,56],[60,56],[86,56]];
function treeSVG(){
  const roots=[];
  for(let i=0;i<9;i++){
    const side=i%2?1:-1, d=12+i*6, x2=60+side*(8+i*4.5);
    roots.push(`<path d="M60 80 Q${60+side*4} ${80+d*.5} ${x2} ${80+d}" stroke="${i<S.roots?C.leaf:C.line}" stroke-width="${i<S.roots?2:1}" fill="none" stroke-linecap="round"/>`);
  }
  const fr=FRUITS.map((f,i)=>{const l=S.fruit[f],[x,y]=FPOS[i],r=l>=3?6.5:l>=1?5:4;
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fruitColor(l)}" stroke="${l===0?C.muted:'none'}" stroke-dasharray="${l===0?'2 2':''}"><title>${f}</title></circle>`}).join('');
  return `<svg viewBox="0 0 120 150" role="img" aria-label="生命树：根 ${S.roots}/9">
    <ellipse cx="60" cy="38" rx="52" ry="32" fill="#1f3326"/>
    <rect x="57" y="52" width="6" height="28" fill="#5b4a37"/>
    <line x1="4" y1="80" x2="116" y2="80" stroke="${C.earth}" stroke-width="1.5"/>
    ${roots.join('')}${fr}</svg>`;
}
function hud(){
  $('#sickBar').style.width=S.sick+'%';
  $('#spiritBar').style.width=S.spirit+'%';
  $('#spiritRow').classList.toggle('locked',!S.unlocked);
  $('#treeBtn').innerHTML=treeSVG();
  $('#burdens').innerHTML=S.burdens.map(b=>`<span>${b}</span>`).join('');
}
function fruit(name,d){ if(!name) return; S.fruit[name]=clamp(S.fruit[name]+d,-1,3); hud(); }
$('#treeBtn').onclick=()=>{
  $('#flist').innerHTML=FRUITS.map(f=>{const l=S.fruit[f];return `<div style="border-bottom:3px solid ${l===0?C.line:fruitColor(l)}">${f}<small>${['枯萎','未结','发芽','结果','成熟'][l+1]}</small></div>`}).join('');
  $('#fruitPanel').hidden=false;
};
$('#fruitClose').onclick=()=>{$('#fruitPanel').hidden=true};

let toastT;
function toast(msg,ms=2200){ const t=$('#toast'); t.innerHTML=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),ms); }

/* ================= 等候（圣灵连接） ================= */
const waitBtn=$('#waitBtn');
let lockedNag=0;
function setWaiting(on){
  if(on && !S.unlocked){ if(performance.now()-lockedNag>1500){ toast('重担压在心头，心乱如麻，静不下来……'); lockedNag=performance.now(); } return; }
  S.waiting=on; waitBtn.classList.toggle('on',on);
}
waitBtn.addEventListener('pointerdown',e=>{e.preventDefault();waitBtn.setPointerCapture?.(e.pointerId);setWaiting(true)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>waitBtn.addEventListener(ev,()=>setWaiting(false)));
waitBtn.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();if(!e.repeat)setWaiting(true)} });
addEventListener('keyup',e=>{ if(e.code==='Space'){e.preventDefault();setWaiting(false)} });
function unlockSpirit(){ S.unlocked=true; waitBtn.classList.remove('locked'); S.spirit=Math.max(S.spirit,20); hud(); }

/* ================= 场景管理与主循环 ================= */
let cleanup=null, sceneTick=null, decay=true;
function go(fn,...args){
  if(cleanup) cleanup(); cleanup=null; sceneTick=null; decay=true;
  [...stage.children].forEach(c=>{ if(c.id!=='toast') c.remove(); });
  $('#fightBtn').hidden=true;
  $('#keys').textContent=S.unlocked?'长按「等候」（或空格键）安静祷告，圣灵的光会亮起来。':'';
  cleanup=fn(...args)||null;
}
let last=performance.now(), hudT=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(S.unlocked){
    if(S.waiting){ S.spirit=clamp(S.spirit+22*dt,0,100); S.waitSec+=dt; }
    else if(decay){ S.spirit=clamp(S.spirit-1.6*dt,0,100); }
  }
  if(sceneTick) sceneTick(dt);
  hudT+=dt; if(hudT>.1){ hudT=0; $('#sickBar').style.width=S.sick+'%'; $('#spiritBar').style.width=S.spirit+'%'; }
  requestAnimationFrame(loop);
}
function page(html){
  const wrap=document.createElement('div'); wrap.className='scroll';
  wrap.innerHTML=`<div class="page">${html}</div>`; stage.appendChild(wrap); wrap.scrollTop=0; return wrap;
}
const V=(t,ref)=>`<div class="verse">${t}<cite>${ref}</cite></div>`;

/* ---------- 叙事页 ---------- */
function story({eyebrow,title,paras=[],verses=[],btn='继续',next,extra=''}){
  return go(()=>{
    const w=page(`${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}${title?`<h2>${title}</h2>`:''}
      <div class="story" style="display:grid;gap:12px">${paras.map(p=>`<p>${p}</p>`).join('')}</div>
      ${verses.map(v=>V(v[0],v[1])).join('')}${extra}
      <button class="btn" id="nx">${btn}</button>`);
    w.querySelector('#nx').onclick=next;
  });
}

/* ---------- 选择卡 ---------- */
/* option: {kind:'flesh'|'spirit'|'locked', text, fruit, reply, verse:[t,ref], burden:'+x'|'-x'} */
function choice({eyebrow,title,situation,verses=[],options,need=40,next}){
  go(()=>{
    const hasSpirit=options.some(o=>o.kind==='spirit');
    const w=page(`${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h2>${title}</h2>
      <div class="story"><p>${situation}</p></div>${verses.map(v=>V(v[0],v[1])).join('')}
      ${hasSpirit?`<div class="hint" id="hint">🕊 有一条路还看不清。长按「等候」，让圣灵光照。</div>`:''}
      <div class="opts" id="opts"></div><div id="out"></div>`);
    const box=w.querySelector('#opts');
    const order=[...options].sort(()=>Math.random()-.5);
    order.forEach(o=>{
      const b=document.createElement('button');
      b.className='opt '+o.kind+(o.kind==='spirit'?' dim':'');
      b.innerHTML=`<span class="tag">${o.kind==='spirit'?'顺着圣灵':o.kind==='locked'?'还看不见的路':'凭自己'}</span>${o.text}`;
      b.onclick=()=>pickOpt(o,w);
      box.appendChild(b); o.el=b;
    });
    sceneTick=()=>{
      const sp=options.find(o=>o.kind==='spirit'); if(!sp||sp.shown) return;
      if(S.spirit>=need){ sp.shown=true; sp.el.classList.remove('dim'); const h=w.querySelector('#hint'); if(h) h.textContent='🕊 圣灵光照，你看见了另一条路。'; }
    };
    function pickOpt(o){
      sceneTick=null;
      box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
      box.style.opacity=.55;
      const spirit=o.kind==='spirit';
      if(spirit){ S.obey++; S.spirit=clamp(S.spirit+10,0,100); fruit(o.fruit,+1); }
      else { S.flesh++; S.spirit=clamp(S.spirit-15,0,100); fruit(o.fruit,-1); }
      if(o.burden?.[0]==='+' && !S.burdens.includes(o.burden.slice(1))) S.burdens.push(o.burden.slice(1));
      if(o.burden?.[0]==='-') S.burdens=S.burdens.filter(b=>b!==o.burden.slice(1));
      hud();
      const out=w.querySelector('#out');
      out.innerHTML=`<div class="reply ${spirit?'spirit':'flesh'} rise">
        <p class="story" style="font-family:var(--serif)">${o.reply}</p>
        ${o.fruit?`<p class="note">${spirit?`🌱 「${o.fruit}」结出来了`:`🍂 「${o.fruit}」枯萎了`}</p>`:''}
        ${o.verse?V(o.verse[0],o.verse[1]):''}
        <button class="btn" id="nx">继续</button></div>`;
      out.querySelector('#nx').onclick=next;
      out.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  });
}

/* ================= 画布工具 ================= */
function makeCanvas(){
  const cv=document.createElement('canvas'); stage.prepend(cv);
  const ctx=cv.getContext('2d'); let W=0,H=0;
  const fit=()=>{ const r=stage.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1);
    W=r.width; H=r.height; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0); };
  fit(); addEventListener('resize',fit);
  return {cv,ctx,get W(){return W},get H(){return H},off(){removeEventListener('resize',fit)}};
}
function drawGerm(ctx,g){
  ctx.save(); ctx.translate(g.x,g.y);
  const n=10; ctx.beginPath();
  for(let i=0;i<=n*2;i++){ const a=i/(n*2)*Math.PI*2+g.ph, r=i%2?g.r:g.r*1.28; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
  ctx.fillStyle='rgba(185,95,163,.78)'; ctx.fill();
  ctx.strokeStyle='rgba(226,166,210,.8)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font=`500 ${Math.max(10,g.r*.62)}px ${FONT}`;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(g.label,0,1);
  ctx.restore();
}
function drawTraveler(ctx,x,y,burden,t,sea){
  ctx.save(); ctx.translate(x,y);
  if(sea){ ctx.fillStyle='#5b4a37'; ctx.beginPath(); ctx.moveTo(-26,12); ctx.lineTo(26,12); ctx.lineTo(18,22); ctx.lineTo(-18,22); ctx.closePath(); ctx.fill(); }
  const bob=sea?Math.sin(t*3)*2:Math.abs(Math.sin(t*8))*-2;
  ctx.translate(0,bob);
  for(let i=0;i<burden;i++){ ctx.fillStyle=i%2?'#7a6750':'#8b7659'; ctx.beginPath(); ctx.roundRect(-20-i*2,-10-i*7,13,8,3); ctx.fill(); }
  ctx.fillStyle='#c9b89a'; ctx.beginPath(); ctx.moveTo(-9,12); ctx.lineTo(9,12); ctx.lineTo(5,-6); ctx.lineTo(-5,-6); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e6d3b3'; ctx.beginPath(); ctx.arc(0,-11,6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#8b6f4e'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(10,-14); ctx.lineTo(13,14); ctx.stroke();
  ctx.restore();
}
function pop(list,x,y,text,color){ list.push({x,y,text,color,life:1.4}); }
function drawPops(ctx,list,dt){
  for(const p of list){ p.life-=dt; p.y-=22*dt; ctx.globalAlpha=clamp(p.life,0,1); ctx.fillStyle=p.color; ctx.font=`500 14px ${FONT}`; ctx.textAlign='center'; ctx.fillText(p.text,p.x,p.y); }
  ctx.globalAlpha=1; for(let i=list.length-1;i>=0;i--) if(list[i].life<=0) list.splice(i,1);
}

/* ================= 旅程（去程 / 回程） ================= */
/* time: 每一关争战的秒数；wave: 病菌墙间隔（秒）；rate: 零散病菌密度；三关都躲不过，只能争战 */
const LEGS={
  out:[
    {name:'腓立比 → 帖撒罗尼迦',sub:'埃格那提亚大道',time:60,rate:.7,wave:5.5,types:['结党','纷争','怨言','不同心']},
    {name:'横渡亚得里亚海',sub:'底拉古 → 布林迪西',time:60,rate:.95,wave:4.5,types:['嫉妒','纷争','结党','敌对','怨言'],sea:true},
    {name:'亚壁古道 → 罗马',sub:'病得几乎要死（2:27）',time:60,rate:1.2,wave:3.6,types:['嫉妒','结党','纷争','怨言','虚荣','忧虑'],fever:true}
  ],
  back:[
    {name:'罗马 → 亚壁古道',sub:'回家的路',time:60,rate:.8,wave:5,types:['忧虑','怨言','纷争']},
    {name:'横渡亚得里亚海',sub:'布林迪西 → 底拉古',time:60,rate:1,wave:4.3,types:['敌对','嫉妒','纷争','结党'],sea:true},
    {name:'埃格那提亚大道 → 腓立比',sub:'带着一封喜乐的信',time:60,rate:1.2,wave:3.8,types:['结党','不同心','怨言','嫉妒','虚荣']}
  ]
};
function drawSupply(ctx,it){
  ctx.save(); ctx.translate(it.x,it.y);
  ctx.shadowColor=it.kind==='oil'?'rgba(242,193,78,.8)':'rgba(140,200,235,.8)'; ctx.shadowBlur=14;
  if(it.kind==='oil'){ // 油瓶
    ctx.fillStyle='#d9a93a'; ctx.beginPath(); ctx.ellipse(0,4,10,11,0,0,Math.PI*2); ctx.fill();
    ctx.fillRect(-3,-12,6,8); ctx.fillStyle='#fff3c4'; ctx.fillRect(-4,-14,8,3);
  } else { // 水滴
    ctx.fillStyle='#8cc8eb'; ctx.beginPath(); ctx.moveTo(0,-14); ctx.quadraticCurveTo(12,2,0,12); ctx.quadraticCurveTo(-12,2,0,-14); ctx.fill();
  }
  ctx.shadowBlur=0; ctx.fillStyle=C.text; ctx.font='11px '+FONT; ctx.textAlign='center'; ctx.fillText(it.kind==='oil'?'油':'水',0,28);
  ctx.restore();
}
function journey(mode,idx,next){
  go(()=>{
    const L=LEGS[mode][idx], back=mode==='back';
    setAct(L.name,L.sub);
    const K=makeCanvas(), {ctx}=K;
    const germs=[], items=[], pops=[], slashes=[], stars=[...Array(60)].map(()=>[Math.random(),Math.random()*.5,Math.random()]);
    let dist=0, run=0, t=0, spawn=1, wave=2.2, supply=2.5, py=K.H*.55, ty=py, flash=0, done=false, cool=0, capped=false;
    const lights=[]; let lightT=1.2, thinWarned=false;
    const fb=$('#fightBtn'); fb.hidden=false; fb.textContent='⚔ 争战';
    $('#keys').innerHTML=(back?'抓住金色的光，平安就加厚 · 长按「等候」光会靠近 · ':'')+'点病菌或按「争战」（F 键）击碎它 · 拖动 / ↑↓ 移动，接住油和水';
    if(idx===0) toast(back?'同样的路，同样的病菌，一样躲不过。':'结党、嫉妒、纷争、怨言……一波一波迎面而来，躲不过，只能争战。',3400);
    const keys={};
    const kd=e=>{keys[e.key]=true; if(e.key==='f'||e.key==='F'||e.key==='ArrowRight') strike();}, ku=e=>{keys[e.key]=false};
    addEventListener('keydown',kd); addEventListener('keyup',ku);
    const reach=()=>K.W*.2+Math.max(240,K.W*.5);
    function kill(g){
      const px=K.W*.2; germs.splice(germs.indexOf(g),1);
      const cost=(back?2:2.5)*(1-S.oil/160);
      S.sick=clamp(S.sick+cost,0,100); S.infect+=cost; S.kills++; S.oil=Math.max(0,S.oil-4);
      slashes.push({x1:px+12,y1:py-6,x2:g.x,y2:g.y,life:.25});
      pop(pops,g.x,g.y-g.r-4,'「'+g.label+'」碎了 · 沾染',S.oil>20?C.lamp:'#e2a6d2');
    }
    function strike(target){
      if(cool>0||done) return; cool=.22;
      const px=K.W*.2;
      const g=target||germs.filter(g=>g.x>px-10&&g.x<reach()).sort((a,b)=>Math.hypot(a.x-px,a.y-py)-Math.hypot(b.x-px,b.y-py))[0];
      if(!g){ pop(pops,px+40,py-30,'前面暂时没有病菌',C.muted); return; }
      kill(g);
    }
    fb.onclick=()=>strike();
    const down=e=>{ const r=K.cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
      const g=germs.find(g=>Math.hypot(g.x-x,g.y-y)<g.r+14 && g.x<reach());
      if(g) strike(g); else ty=clamp(y,40,K.H-30); };
    const move=e=>{ if(e.pointerType==='mouse'||e.buttons){ const r=K.cv.getBoundingClientRect(); ty=clamp(e.clientY-r.top,40,K.H-30); } };
    K.cv.addEventListener('pointerdown',down); K.cv.addEventListener('pointermove',move);

    sceneTick=dt=>{
      if(done) return; t+=dt; cool-=dt;
      const W=K.W,H=K.H, px=W*.2, prog=run/L.time;
      if(keys.ArrowUp) ty=clamp(ty-260*dt,40,H-30);
      if(keys.ArrowDown) ty=clamp(ty+260*dt,40,H-30);
      const heavy=S.burdens.length;
      py+=(ty-py)*Math.min(1,dt*7/(1+heavy*.5));
      const shield=back&&S.peace>0;
      const speed=150*(1-.1*heavy)*(1-S.sick/230)*(S.waiting?.3:1);
      dist+=speed*dt; run+=dt*(S.waiting?.3:1);
      // 病
      if(!back){ S.sick+=heavy*.1*dt+(L.fever?.3*dt:0); S.sick=Math.min(S.sick,L.fever?99:90); }
      else { if(S.waiting) S.sick=Math.max(0,S.sick-4*dt);
        S.peace=Math.max(0,S.peace-.5*dt);
        if(S.peace<25&&S.peace>0&&!thinWarned){ thinWarned=true; toast('平安若只靠自己持守，就会变薄。不断从圣灵领受，它就更新。',3600); }
        if(S.sick>=95){ S.sick=95; if(!capped){ capped=true; toast('病菌还在你身上，可是你还走得动。',3000); } } }
      // 病菌墙：一波比一波厚
      wave-=dt;
      if(wave<=0 && prog<.95){ wave=L.wave*(1-prog*.35);
        const cols=idx>=1&&prog>.45?2:1, gap=46;
        for(let c=0;c<cols;c++) for(let y=46;y<H-20;y+=gap)
          germs.push({x:W+30+c*48,y:y+rnd(-4,4)+(c?gap/2:0),r:20,label:pick(L.types),vx:-(speed*.9+40),vy:0,ph:Math.random()*6,w:rnd(.8,1.6),wall:true}); }
      // 零散病菌
      spawn-=dt;
      if(spawn<=0 && prog<.95){ spawn=rnd(.7,1.4)/(L.rate*(1+prog*.6));
        germs.push({x:W+30,y:rnd(50,H-40),r:rnd(17,24),label:pick(L.types),vx:-rnd(60,120)-speed*.6,vy:0,ph:Math.random()*6,w:rnd(1,2.5)}); }
      // 从上面来的光（4:8），抓住就加厚平安（4:9）
      if(back){ lightT-=dt*(S.waiting?2.2:1);
        if(lightT<=0 && prog<.96){ lightT=rnd(1.4,2.4); lights.push({x:rnd(W*.4,W),y:-20,label:pick(GOOD),vx:-rnd(30,70),vy:rnd(40,70)}); }
        for(let i=lights.length-1;i>=0;i--){ const l=lights[i]; l.x+=l.vx*dt-speed*.3*dt; l.y+=l.vy*dt;
          if(S.waiting){ l.x+=(px-l.x)*dt*.8; l.y+=(py-l.y)*dt*.8; }
          if(Math.hypot(l.x-px,l.y-py)<34){ lights.splice(i,1); S.peace=Math.min(100,S.peace+20); S.received++; thinWarned=false;
            pop(pops,px,py-56,`抓住「${l.label}」，平安加厚了`,C.lamp);
            if(S.received===1) toast('「这些事你们都要思念……赐平安的神就必与你们同在。」腓立比书 4:8-9',4200);
            continue; }
          if(l.y>H+30||l.x<-40) lights.splice(i,1); } }
      // 圣灵的供应：油和水
      supply-=dt;
      if(supply<=0 && prog<.96){ supply=rnd(1.8,3);
        items.push({kind:Math.random()<.5?'oil':'water',x:W+20,y:rnd(60,H-50),ph:Math.random()*6}); }
      for(let i=items.length-1;i>=0;i--){ const it=items[i]; it.x-=(speed*.8+50)*dt; it.y+=Math.sin(t*2+it.ph)*14*dt;
        if(Math.hypot(it.x-px,it.y-py)<28){ items.splice(i,1); S.supplyGot++;
          if(it.kind==='oil'){ S.oil=Math.min(100,S.oil+30); pop(pops,px,py-40,'油：得着力量，争战时沾染得少',C.lamp); }
          else { S.sick=Math.max(0,S.sick-15); pop(pops,px,py-40,'水：解渴退烧','#8cc8eb'); }
          if(S.supplyGot===1) toast('「借着……耶稣基督之灵的帮助」（1:19）。「帮助」原文是供应、补给。',4200);
          continue; }
        if(it.x<-30) items.splice(i,1); }
      for(let i=germs.length-1;i>=0;i--){ const g=germs[i];
        g.x+=g.vx*dt; g.vy*=.95; g.y+=(g.vy+(g.wall?Math.sin(t*g.w+g.ph)*4:Math.sin(t*g.w+g.ph)*18))*dt; g.ph+=dt*.6;
        const d=Math.hypot(g.x-px,g.y-py);
        if(shield && d<g.r+40){ germs.splice(i,1); S.peace=Math.max(0,S.peace-6); pop(pops,g.x,g.y,S.peace>0?'平安保守':'平安被打穿了',S.peace>0?C.lamp:C.fever);
          if(S.peace<=0){ S.peaceBroken++; flash=.25; }
          continue; }
        if(d<g.r+14){ germs.splice(i,1); const hit=back?5:7; S.sick=clamp(S.sick+hit,0,back?95:(L.fever?99:90)); S.infect+=hit; flash=.35; pop(pops,px,py-34,'冲过去，染上了「'+g.label+'」',C.fever); continue; }
        if(g.x<-40) germs.splice(i,1);
      }
      if(run>=L.time){ done=true; return next(); }

      // ---- 画 ----
      const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#0c1120'); sky.addColorStop(1,L.sea?'#15314a':'#2a2a3a');
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
      for(const st of stars){ ctx.fillStyle=`rgba(235,229,214,${.25+st[2]*.5})`; ctx.fillRect(((st[0]*W-dist*.02)%W+W)%W,st[1]*H,1.5,1.5); }
      if(L.sea){
        ctx.strokeStyle='rgba(120,170,200,.25)'; ctx.lineWidth=1.5;
        for(let r=0;r<9;r++){ const y=H*.25+r*H*.085; ctx.beginPath();
          for(let x=0;x<=W;x+=12) ctx.lineTo(x,y+Math.sin((x+dist*(.5+r*.1))/40+r)*4); ctx.stroke(); }
      } else {
        ctx.fillStyle='#1d2433'; ctx.beginPath(); ctx.moveTo(0,H*.32);
        for(let x=0;x<=W;x+=16) ctx.lineTo(x,H*.32-Math.abs(Math.sin((x+dist*.15)/120))*38); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
        ctx.fillStyle='#262c3a'; ctx.fillRect(0,H*.34,W,H*.66);
        ctx.strokeStyle='rgba(166,169,159,.12)'; ctx.setLineDash([22,26]); ctx.lineDashOffset=dist%48;
        for(const f of [.5,.75]){ ctx.beginPath(); ctx.moveTo(W,H*f); ctx.lineTo(0,H*f); ctx.stroke(); }
        ctx.setLineDash([]);
        const m=(W+80)-(dist*1.0)%(W+160);
        ctx.fillStyle='#4a4f5c'; ctx.fillRect(m,H*.34-26,10,26);
      }
      if(S.sick>60){ ctx.fillStyle=`rgba(224,100,90,${(S.sick-60)/400})`; ctx.fillRect(0,0,W,H); }
      items.forEach(it=>drawSupply(ctx,it));
      germs.forEach(g=>drawGerm(ctx,g));
      for(let i=slashes.length-1;i>=0;i--){ const sl=slashes[i]; sl.life-=dt; if(sl.life<=0){ slashes.splice(i,1); continue; }
        ctx.strokeStyle=`rgba(235,229,214,${sl.life*4})`; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(sl.x1,sl.y1); ctx.lineTo(sl.x2,sl.y2); ctx.stroke(); }
      if(shield){ const pr=S.peace/100; ctx.save(); ctx.globalAlpha=.3+pr*.6; ctx.strokeStyle=C.lamp; ctx.fillStyle=`rgba(242,193,78,${.05+pr*.12})`; ctx.lineWidth=1+pr*3;
        ctx.beginPath(); ctx.arc(px,py-4,40,0,Math.PI*2); ctx.fill(); ctx.stroke();
        if(pr<.35){ ctx.strokeStyle='rgba(17,23,38,.9)'; ctx.lineWidth=2; for(let c=0;c<4;c++){ const a0=c*1.6+.4; ctx.beginPath(); ctx.moveTo(px+Math.cos(a0)*40,py-4+Math.sin(a0)*40); ctx.lineTo(px+Math.cos(a0+.2)*30,py-4+Math.sin(a0+.2)*30); ctx.stroke(); } }
        ctx.restore(); ctx.fillStyle=C.lamp; ctx.font='12px '+FONT; ctx.textAlign='center'; ctx.fillText(`平安 ${Math.round(S.peace)}`,px,py-50); }
      for(const l of lights){ ctx.save(); ctx.shadowColor='rgba(242,193,78,.9)'; ctx.shadowBlur=16; ctx.fillStyle='rgba(242,193,78,.25)';
        ctx.beginPath(); ctx.arc(l.x,l.y,18,0,Math.PI*2); ctx.fill(); ctx.restore();
        ctx.fillStyle=C.lamp; ctx.font='500 12px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(l.label,l.x,l.y); ctx.textBaseline='alphabetic'; }
      // 病越重，身子越弯，最后是爬
      ctx.save(); ctx.translate(px,py); ctx.rotate(S.sick>70?(S.sick-70)/30*1.1:0); ctx.translate(-px,-py);
      drawTraveler(ctx,px,py+(S.sick>85?8:0),heavy,t*(1-S.sick/150),L.sea); ctx.restore();
      if(flash>0){ flash-=dt; ctx.fillStyle=`rgba(224,100,90,${flash})`; ctx.fillRect(0,0,W,H); }
      drawPops(ctx,pops,dt);
      // 进度与油
      const pw=W-32; ctx.fillStyle=C.night2; ctx.fillRect(16,12,pw,4);
      ctx.fillStyle=back?C.leaf:C.lamp; ctx.fillRect(16,12,pw*Math.min(1,prog),4);
      ctx.fillStyle=C.muted; ctx.font='12px '+FONT; ctx.textAlign='left';
      const [a,b]=L.name.split(' → '); ctx.fillText(a,16,32); if(b){ ctx.textAlign='right'; ctx.fillText(b,W-16,32); }
      ctx.textAlign='center'; ctx.fillText(`还要争战 ${Math.max(0,Math.ceil(L.time-run))} 秒`,W/2,32);
      ctx.textAlign='left'; ctx.fillStyle=C.muted; ctx.fillText('油',16,H-14);
      ctx.fillStyle=C.night2; ctx.fillRect(34,H-22,90,6); ctx.fillStyle=C.lamp; ctx.fillRect(34,H-22,90*S.oil/100,6);
    };
    return ()=>{ K.off(); removeEventListener('keydown',kd); removeEventListener('keyup',ku); };
  });
}

      ${V('我已经从以巴弗提受了你们的馈送，当作极美的香气，为神所收纳、所喜悦的祭物。','腓立比书 4:18')}

function prologue(){

    };
    sceneTick=dt=>{
      if(done) return; t+=dt;

      if(keys.ArrowUp) ty=clamp(ty-260*dt,top,bot);

      // 自以为义：最后一个方阵
      if(!deepOn && prog>=.8){ deepOn=true; for(let r=0;r*32<=bot-top+10;r++) creds.push({x:W+40,y:top+r*32,label:'律法上的义',deep:true}); }
      // 从上面来的光

      if(light<=0 && prog<.95){ light=rnd(1.2,2); const n=pick(GOOD); lights.push({x:W+30,y:rnd(top,bot),label:n}); }
      for(let i=creds.length-1;i>=0;i--){ const c=creds[i]; c.x-=(speed+30)*dt;
        if(Math.abs(c.x-px)<34&&Math.abs(c.y-py)<(c.deep?26:22)){ creds.splice(i,1);
          if(c.deep){ S.deepCaught=true; if(!web.some(w=>w.deep)){ web.push({n:'自以为义',deep:true}); toast('「就律法上的义说，我是无可指摘的。」最深的一层缠上来了。',3600);
              prize={x:W*.72,y:(top+bot)/2}; } }
          else { web.push({n:c.label}); if(firstStick){ firstStick=false; toast('碰到就缠上身，像蜘蛛网一样。',2400);} }

        if(c.x<-60) creds.splice(i,1); }
      for(let i=lights.length-1;i>=0;i--){ const l=lights[i]; l.x-=(speed*.7+50)*dt;

          toast('不是你抓住了祂，是祂得着了你。「自以为义」和其余的一切都松开了。<br>「以认识我主基督耶稣为至宝……不是有自己因律法而得的义，乃是有信基督的义。」3:8-9',6000); } }
      // 回头
      if(lookOpen>0){ lookOpen-=dt; if(lookOpen<=0){ lookEl.hidden=true; S.obey++; S.spirit=clamp(S.spirit+8,0,100); pop(pops,px,py-40,'忘记背后，努力面前',C.leaf); lookT=rnd(9,12);} }
      else { lookT-=dt; if(lookT<=0) showLook(); }
      if(dist>=GOAL){ done=true; lookEl.hidden=true; return finishRun(); }
      // ---- 画 ----
      const g=ctx.createLinearGradient(0,0,W,0); g.addColorStop(0,'#141a2a'); g.addColorStop(1,'#232a3c'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(166,169,159,.1)'; ctx.setLineDash([30,30]); ctx.lineDashOffset=dist%60;

      ctx.font=`500 13px ${FONT}`; ctx.textBaseline='middle'; ctx.textAlign='center';
      for(const c of creds){ const tw=ctx.measureText(c.label).width+14, glint=.5+.5*Math.sin(t*4+c.y);

        ctx.beginPath(); ctx.roundRect(c.x-tw/2,c.y-12,tw,24,4); ctx.fill(); ctx.stroke();

      for(const l of lights){ ctx.save(); ctx.shadowColor='rgba(242,193,78,.9)'; ctx.shadowBlur=18; ctx.fillStyle='rgba(242,193,78,.25)';
        ctx.beginPath(); ctx.arc(l.x,l.y,20,0,Math.PI*2); ctx.fill(); ctx.restore(); ctx.fillStyle=C.lamp; ctx.fillText(l.label,l.x,l.y); }
      if(prize){ ctx.save(); ctx.shadowColor='#fff3c4'; ctx.shadowBlur=30; ctx.fillStyle='rgba(255,243,196,.35)'; ctx.beginPath(); ctx.arc(prize.x,prize.y,30+Math.sin(t*3)*3,0,Math.PI*2); ctx.fill(); ctx.restore();
        ctx.fillStyle='#fff3c4'; ctx.fillText('至宝',prize.x,prize.y-2); ctx.font=`11px ${FONT}`; ctx.fillText('基督耶稣',prize.x,prize.y+14); ctx.font=`500 13px ${FONT}`; }

        const n=Math.min(24,web.length*2+(tight*20|0));

        for(let r=12;r<=12+Math.min(4,web.length/2)*6;r+=6){ ctx.beginPath(); ctx.arc(px,py-4,r,0,Math.PI*2); ctx.stroke(); } }
      if(S.waiting){ ctx.fillStyle='rgba(242,193,78,.07)'; ctx.fillRect(0,0,W,H); }
      drawPops(ctx,pops,dt);
      const pw=W-32; ctx.fillStyle=C.night2; ctx.fillRect(16,12,pw,4); ctx.fillStyle=C.lamp; ctx.fillRect(16,12,pw*Math.min(1,prog),4);

    };

  });

  const fg=order.map(f=>S.fruit[f]<0?-1:Math.max(.12,target(S.fruit[f])*.4));
  const sprouted=order.map(()=>false), pops=[];
  const FP=[[0,-.95],[-.55,-.6],[.55,-.6],[-.82,-.05],[0,-.3],[.82,-.05],[-.45,.45],[.05,.4],[.5,.5]];
  const BP=[[-.3,-1.05],[.3,-1.05],[-.95,-.35],[.95,-.35],[-.75,.6],[.75,.6],[-.2,.85],[.25,.85]];
  sceneTick=dt=>{
    t+=dt; if(done) doneT+=dt;
    if(!done && S.waiting){ p=Math.min(1,p+dt/HOLD); }
    const L=Math.min(8,Math.floor(p*9));
    if(p>0 && L!==layer){ layer=L; const s=STEPS[L];
      cap.innerHTML=`<b>第 ${L+1} 层根 · ${s.ph}</b><br><span class="christ">${s.christ}</span>`; }
    if(!done && p>=1){ done=true; after.hidden=false;
      cap.innerHTML='<b>九层根都扎好了。</b><br><span class="christ">「成了。」基督为你成就的，一层都不缺。可是你看，树上的果子还在长。</span>';
      setTimeout(()=>after.scrollIntoView({behavior:'smooth',block:'start'}),1800); }
    // 果子：根扎到第 i 层，第 i 种果子才开始长；之后一直慢慢长，永不停在「完成」
    order.forEach((f,i)=>{ const lit=p*9>=i+1;
      if(lit){ if(fg[i]<0){ fg[i]=.15; sprouted[i]=true; pops.push({i,life:3}); }
        const goal=Math.min(.95,target(S.fruit[f])+doneT*.0015);
        fg[i]+=(goal-fg[i])*Math.min(1,dt*.6); } });
    // ---- 画 ----
    ctx.clearRect(0,0,W,H);
    const cx=W/2, gy=H*.42, rootH=H-gy-26, ox=Math.min(W*.4,190), oy=H*.15, ccy=H*.2;
    const sky=ctx.createLinearGradient(0,0,0,gy); sky.addColorStop(0,'#101727'); sky.addColorStop(1,'#1b2436'); ctx.fillStyle=sky; ctx.fillRect(0,0,W,gy);
    const soil=ctx.createLinearGradient(0,gy,0,H); soil.addColorStop(0,'#2a2219'); soil.addColorStop(1,'#16110c'); ctx.fillStyle=soil; ctx.fillRect(0,gy,W,H-gy);
    ctx.strokeStyle=C.earth; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
    // 树冠与树干
    ctx.fillStyle=`rgba(31,51,38,${.55+p*.45})`; ctx.beginPath(); ctx.ellipse(cx,ccy,ox,oy,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5b4a37'; ctx.beginPath(); ctx.moveTo(cx-7,gy); ctx.lineTo(cx+7,gy); ctx.lineTo(cx+4,ccy+oy*.4); ctx.lineTo(cx-4,ccy+oy*.4); ctx.fill();
    // 根：主根一直往下，每层一条侧根，扎到了就发光并显出经文
    const depth=p*rootH;
    ctx.strokeStyle=C.lamp; ctx.lineWidth=3; ctx.globalAlpha=.9; ctx.beginPath(); ctx.moveTo(cx,gy); ctx.lineTo(cx,gy+depth); ctx.stroke(); ctx.globalAlpha=1;
    ctx.font=`11px ${FONT}`; ctx.textBaseline='middle';
    STEPS.forEach((s,i)=>{ const r=clamp(p*9-i,0,1), y=gy+(i+.7)*rootH/9, side=i%2?1:-1;
      const len=Math.min(W*.42-12,150)*r, x2=cx+side*len;
      ctx.strokeStyle=r>=1?C.lamp:'rgba(242,193,78,.45)'; ctx.lineWidth=r>=1?2:1.2;
      if(r>0){ ctx.beginPath(); ctx.moveTo(cx,y-8); ctx.quadraticCurveTo(cx+side*len*.4,y+6,x2,y); ctx.stroke();
        ctx.globalAlpha=r; ctx.fillStyle=r>=1?'#f5dc9a':C.muted; ctx.textAlign=side<0?'left':'right';
        ctx.fillText(s.ph,side<0?Math.max(6,x2-4):Math.min(W-6,x2+4),y-12); ctx.globalAlpha=1; } });
    if(p>=1){ ctx.strokeStyle=C.lamp; ctx.lineWidth=3; const by=H-16; ctx.beginPath(); ctx.moveTo(cx,by-16); ctx.lineTo(cx,by+10); ctx.moveTo(cx-10,by-6); ctx.lineTo(cx+10,by-6); ctx.stroke(); }
    // 4:8 的八样，开在枝头
    GOOD.forEach((n,k)=>{ const b=clamp(p*8.5-k,0,1); if(b<=0) return; const x=cx+BP[k][0]*ox, y=ccy+BP[k][1]*oy;
      ctx.globalAlpha=b; ctx.fillStyle='#f3d6e4';
      for(let a=0;a<5;a++){ ctx.beginPath(); ctx.arc(x+Math.cos(a*1.257+t*.2)*4*b,y+Math.sin(a*1.257+t*.2)*4*b,3*b,0,Math.PI*2); ctx.fill(); }
      ctx.fillStyle=C.lamp; ctx.beginPath(); ctx.arc(x,y,1.8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#f3d6e4'; ctx.font=`10px ${FONT}`; ctx.textAlign='center'; ctx.fillText(n,x,y+12); ctx.globalAlpha=1; });
    // 圣灵的九种果子
    order.forEach((f,i)=>{ const x=cx+FP[i][0]*ox*.8, y=ccy+FP[i][1]*oy*.8, g=fg[i];
      if(g<0){ ctx.fillStyle=C.earth; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill(); }
      else { const col=g<.4?'#86ad6f':g<.7?'#c9c26a':g<.85?C.lamp:'#ef8a5a';
        ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,3+g*7+Math.sin(t*2+i)*.4,0,Math.PI*2); ctx.fill(); }
      ctx.fillStyle=C.text; ctx.font=`11px ${FONT}`; ctx.textAlign='center'; ctx.fillText(f,x,y+15); });
    for(let k=pops.length-1;k>=0;k--){ const q=pops[k]; q.life-=dt; if(q.life<=0){ pops.splice(k,1); continue; }
      const x=cx+FP[q.i][0]*ox*.8, y=ccy+FP[q.i][1]*oy*.8-16-(3-q.life)*6;
      ctx.globalAlpha=Math.min(1,q.life); ctx.fillStyle='#bfe0a8'; ctx.font=`500 12px ${FONT}`; ctx.textAlign='center'; ctx.fillText(`「${order[q.i]}」重新发芽了`,x,y); ctx.globalAlpha=1; }
    ctx.textBaseline='alphabetic';
  };
  root._off=()=>removeEventListener('resize',fit);
}
function ending(){
  setAct('腓立比','信还没有读完');
  const N=t=>`<p class="story" style="font-family:var(--serif);font-size:16.5px;line-height:1.95">${t}</p>`;
  const beats=[
    N(`以巴弗提回到了腓立比。${S.sick>40?'他身上还带着路上的病菌，走路还有点喘，':'他身上还带着路上的一些病菌，'}可是一路上，神所赐的平安守着他的心。`),
    N('主日，会众聚在一起。以巴弗提打开保罗的信，一句一句读出来。'),
    V('我每逢想念你们，就感谢我的神……因为从头一天直到如今，你们是同心合意地兴旺福音。','腓立比书 1:3-5'),
    V('你们就要意念相同，爱心相同，有一样的心思，有一样的意念，使我的喜乐可以满足。','腓立比书 2:2'),
    N('读到第二章末了，有人抬起头看着以巴弗提。保罗在信里说，他病了，几乎要死。'),
    V('故此，你们要在主里欢欢乐乐地接待他，而且要尊重这样的人。','腓立比书 2:29'),
    N('然后，以巴弗提读到了两个名字。'),
    V('我劝友阿爹和循都基要在主里同心。','腓立比书 4:2'),
    N('屋子里很安静。友阿爹没有抬头。循都基的手握得很紧。'),
    N('以巴弗提停了一下，继续往下读……')
  ];
  go(()=>{
    const w=page(`<div class="eyebrow">终章 · 腓立比</div><h2>信还没有读完</h2>
      <div id="read" style="display:grid;gap:14px"></div>
      <button class="btn" id="more">读下去</button>
      <div id="rest" hidden style="display:grid;gap:16px"></div>`);
    const read=w.querySelector('#read'), more=w.querySelector('#more'), rest=w.querySelector('#rest');
    let i=0;
    const step=()=>{
      if(i<beats.length){ const d=document.createElement('div'); d.className='rise'; d.innerHTML=beats[i++]; read.appendChild(d); d.scrollIntoView({behavior:'smooth',block:'nearest'});
        if(i<beats.length) return; }
      more.hidden=true; rest.hidden=false;
      rest.innerHTML=`
        <h1 class="rise" style="text-align:center;letter-spacing:.3em">未完</h1>
        ${N('她们会不会同心，我们不知道。保罗没有写，路加也没有记。')}
        ${N('可是有一件事，从你走进这个故事开始，就一直在发生。')}
        <div class="treebox"><canvas id="lifeTree"></canvas></div>
        <div class="treecap" id="cap"><b>长按下面的「🕊 等候」</b><br>你一路的等候，原来都是在向下扎根。可以一家人轮流按住；累了可以放手，扎下的根不会退回。</div>
        <div id="after" hidden style="display:grid;gap:16px">
        ${N('根已经扎好了，那是基督成就的。果子还在长，那是圣灵还在做的。')}
        ${V('我深信那在你们心里动了善工的，必成全这工，直到耶稣基督的日子。','腓立比书 1:6')}
        <h2>旅程记录</h2>
        <div class="reply" style="gap:6px;font-size:14.5px">
          <p>背回来的重担：${S.burdens.length?S.burdens.join('、'):'没有'}</p>
          <p>松开的资历：${S.dropped} 样　·　自以为义：${S.selfFree?'被基督得着，松开了':'还缠在身上'}</p>
          <p>回程领受的光：${S.received} 次　·　平安被打穿：${S.peaceBroken} 次</p>
          <p>根扎下的深度：${S.roots}/9　·　安静等候：${Math.round(S.waitSec)} 秒　·　击碎病菌：${S.kills} 个</p>
        </div>
        <h2>同一条路，不同的人</h2>
        <div style="overflow-x:auto"><table class="loop">
          <tr><th></th><th>去程</th><th>回程</th></tr>
          <tr><td>到达时</td><td>${{walk:'倒在保罗门口',crawl:'爬到罗马城门',carried:'被弟兄抬进罗马'}[S.arriveHow]||'病得几乎要死'}</td><td>走进腓立比，平安守着心怀意念</td></tr>
          <tr><td>背着的</td><td>教会纷争的重担</td><td>保罗的信，和从神来的平安</td></tr>
          <tr><td>靠的是</td><td>自己的热心</td><td>基督的代赎，在圣灵里得力</td></tr>
        </table></div>
        <h2>下一段旅程</h2>
        <p class="note">保罗在新约留下了十三卷书信。每一卷背后都有一段路，也有一群还没有完成的人。</p>
        <div class="flist" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr))">
          ${LETTERS.map(l=>l==='腓立比书'?`<div style="border:1px solid var(--lamp);color:var(--lamp)">${l}<small>你在这里 · 未完</small></div>`:`<div style="opacity:.55">${l}<small>尚未开启</small></div>`).join('')}
        </div>
        <h2>小组分享</h2>
        <ol class="q">
          <li><b>去程：</b>你现在心里背着什么重担？你所在的群体里，有哪些「病菌」正在弥漫？</li>
          <li><b>罗马：</b>保罗在锁链中怎样看见喜乐？在你最近的处境里，圣灵可能想让你看见什么？</li>
          <li><b>阶梯：</b>九级里，基督降到你家的哪一个地方，是你最需要祂的？</li>
          <li><b>奔跑：</b>你的背包里，哪一样「资历」最难放下？你会被什么声音叫得回头？</li>
          <li><b>回程：</b>你的平安最常被什么打穿？你从圣灵那里领受过什么，使它更新？</li>
          <li><b>未完：</b>如果你是友阿爹或循都基，听到自己的名字被读出来，你会怎样回应？</li>
        </ol>
        <div class="row"><button class="btn" id="again">再走一次</button><button class="btn ghost" id="nt">研经说明</button></div>
        </div>`;
      lifeTree(rest);
      rest.querySelector('#again').onclick=()=>location.reload();
      rest.querySelector('#nt').onclick=()=>story({eyebrow:'研经说明',title:'游戏背后的经文判断',paras:[
        '1:15-17 的嫉妒纷争传道发生在罗马；同样的「结党」（ἐριθεία，1:17；2:3）也在腓立比教会里发作。',
        '以巴弗提的病因经文没有交代，「病菌」是属灵寓意。',
        '4:8 的八样思念都附上了希腊文字义。其中「可爱」（προσφιλής）和「有美名」（εὔφημος）在新约只出现在这一节；「德行」（ἀρετή）在保罗书信也只用这一次。',
        '友阿爹和循都基后来有没有和好，圣经没有记载，所以结局保持开放。',
        '九种果子取自加拉太书 5:22-23。'],btn:'返回',next:ending});
      rest.scrollIntoView({behavior:'smooth',block:'start'});
    };
    more.onclick=step; step();
  });
}

/* ================= 启动 ================= */
hud(); title(); requestAnimationFrame(loop);
</script>
</body>
</html>
